<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Reportes - Multimarca & Juguetimax</title>
  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Encabezado -->
    <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-white">Panel de Reportes</h1>
        <p class="text-slate-400 text-sm">Gestión de cobertura, soportes y facturación</p>
      </div>
      <!-- Selector de Marca -->
      <div class="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700">
        <button id="btn-juguetimax" onclick="cambiarMarca('juguetimax')" class="px-4 py-2 text-sm font-medium rounded-md transition-all bg-indigo-600 text-white">
          Juguetimax
        </button>
        <button id="btn-multimarca" onclick="cambiarMarca('multimarca')" class="px-4 py-2 text-sm font-medium rounded-md transition-all text-slate-400 hover:text-white">
          Multimarca
        </button>
      </div>
    </header>

    <!-- Indicador de marca activa -->
    <div class="flex items-center space-x-2 text-indigo-400 font-semibold text-lg">
      <span>Marca seleccionada:</span>
      <span id="label-marca" class="uppercase tracking-wide text-white bg-slate-800 px-3 py-1 rounded-md border border-slate-700">Juguetimax</span>
    </div>

    <!-- Contenedor de Secciones / Categorías -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 1. Reportes de Cobertura -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-slate-500 transition-all">
        <div>
          <div class="flex items-center space-x-3 mb-3">
            <span class="p-2 bg-blue-500/10 text-blue-400 rounded-lg text-xl">📊</span>
            <h2 class="font-semibold text-lg text-white">Reportes de Cobertura</h2>
          </div>
          <p class="text-slate-400 text-sm mb-4">Archivos de inventario y disponibilidad regional.</p>
        </div>
        <ul id="lista-cobertura" class="space-y-2 text-sm">
          <!-- Se llena dinámicamente -->
        </ul>
      </div>

      <!-- 2. Soportes de Factura -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-slate-500 transition-all">
        <div>
          <div class="flex items-center space-x-3 mb-3">
            <span class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg text-xl">📁</span>
            <h2 class="font-semibold text-lg text-white">Soportes de Factura</h2>
          </div>
          <p class="text-slate-400 text-sm mb-4">Comprobantes de entrega, acuses y notas.</p>
        </div>
        <ul id="lista-soportes" class="space-y-2 text-sm">
          <!-- Se llena dinámicamente -->
        </ul>
      </div>

      <!-- 3. Facturación -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-slate-500 transition-all">
        <div>
          <div class="flex items-center space-x-3 mb-3">
            <span class="p-2 bg-purple-500/10 text-purple-400 rounded-lg text-xl">🧾</span>
            <h2 class="font-semibold text-lg text-white">Facturación</h2>
          </div>
          <p class="text-slate-400 text-sm mb-4">Facturas emitidas en PDF o Excel.</p>
        </div>
        <ul id="lista-facturacion" class="space-y-2 text-sm">
          <!-- Se llena dinámicamente -->
        </ul>
      </div>

    </div>
  </div>

  <script>
    // Base de datos local con los enlaces de tus reportes
    const reportes = {
      juguetimax: {
        cobertura: [
          { nombre: "Cobertura Junio.xls", url: "reportes/juguetimax/cobertura-junio.xls" }
        ],
        soportes: [
          { nombre: "Soporte Entrega #102.pdf", url: "reportes/juguetimax/soporte-102.pdf" }
        ],
        facturacion: [
          { nombre: "Factura_F1002.pdf", url: "reportes/juguetimax/factura-1002.pdf" }
        ]
      },
      multimarca: {
        cobertura: [
          { nombre: "Cobertura General.xls", url: "reportes/multimarca/cobertura-general.xls" }
        ],
        soportes: [],
        facturacion: [
          { nombre: "Factura_M501.pdf", url: "reportes/multimarca/factura-501.pdf" }
        ]
      }
    };

    function cambiarMarca(marca) {
      // Actualizar vista de botones
      const btnJ = document.getElementById('btn-juguetimax');
      const btnM = document.getElementById('btn-multimarca');
      const label = document.getElementById('label-marca');

      label.innerText = marca;

      if (marca === 'juguetimax') {
        btnJ.className = "px-4 py-2 text-sm font-medium rounded-md transition-all bg-indigo-600 text-white";
        btnM.className = "px-4 py-2 text-sm font-medium rounded-md transition-all text-slate-400 hover:text-white";
      } else {
        btnM.className = "px-4 py-2 text-sm font-medium rounded-md transition-all bg-indigo-600 text-white";
        btnJ.className = "px-4 py-2 text-sm font-medium rounded-md transition-all text-slate-400 hover:text-white";
      }

      // Cargar archivos de la marca
      renderLista('lista-cobertura', reportes[marca].cobertura);
      renderLista('lista-soportes', reportes[marca].soportes);
      renderLista('lista-facturacion', reportes[marca].facturacion);
    }

    function renderLista(elementId, items) {
      const container = document.getElementById(elementId);
      if (!items || items.length === 0) {
        container.innerHTML = `<li class="text-slate-500 italic">Sin archivos disponibles</li>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <li>
          <a href="${item.url}" target="_blank" class="flex items-center justify-between p-2 rounded bg-slate-900/50 hover:bg-indigo-600/20 text-indigo-300 hover:text-indigo-200 transition-colors">
            <span class="truncate">${item.nombre}</span>
            <span>↗</span>
          </a>
        </li>
      `).join('');
    }

    // Cargar Juguetimax por defecto
    cambiarMarca('juguetimax');
  </script>
</body>
</html>

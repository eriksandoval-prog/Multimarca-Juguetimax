<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reporte — Inventario</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="back-link">← Volver al portal</a>
    <h1>Reporte: Inventario</h1>
    <p class="meta">Última actualización: <span id="last-updated">--/--/----</span></p>
  </header>

  <main class="report-container">
    <section class="controls">
      <input id="search" type="search" placeholder="Buscar en este reporte..." />
      <button id="print-btn">Imprimir</button>
      <button id="export-csv">Exportar CSV</button>
    </section>

    <section class="report-table">
      <table id="inventario-table">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Producto</th>
            <th>Marca</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Ubicación</th>
          </tr>
        </thead>
        <tbody>
          <!-- Ejemplo de fila; reemplaza por datos reales -->
          <tr>
            <td>0001</td>
            <td>Juguete A</td>
            <td>MarcaX</td>
            <td>120</td>
            <td>$12.50</td>
            <td>Almacén 1</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script>
    // Pequeñas utilidades locales para este reporte
    document.getElementById('print-btn').addEventListener('click', () => window.print());
    document.getElementById('last-updated').textContent = new Date().toLocaleString();

    // Exportar tabla a CSV (simple)
    function tableToCSV(table) {
      const rows = Array.from(table.querySelectorAll('tr'));
      return rows.map(r => Array.from(r.querySelectorAll('th,td')).map(cell => '"' + cell.textContent.replace(/"/g,'""') + '"').join(',')).join('\n');
    }
    document.getElementById('export-csv').addEventListener('click', () => {
      const csv = tableToCSV(document.getElementById('inventario-table'));
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reporte-inventario.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Conecta buscador con la tabla (si tu main.js no lo hace)
    const search = document.getElementById('search');
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      const rows = document.querySelectorAll('#inventario-table tbody tr');
      rows.forEach(r => {
        r.style.display = Array.from(r.cells).some(c => c.textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
